services:

  hadoop:
    build:
      context: .
      dockerfile: hadoop/Dockerfile
    container_name: examen-hadoop
    hostname: hadoop
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - .:/workspace
    networks:
      - examen-red

  db:
    image: postgres:16
    container_name: examen-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    networks:
      - examen-red
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: examen-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      hadoop:
        condition: service_started
    networks:
      - examen-red

volumes:
  datos_postgres:

networks:
  examen-red:
    driver: bridge
